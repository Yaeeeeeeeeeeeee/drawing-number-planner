name: Inspect saved installer window evidence
on:
  push:
    paths:
      - '.github/workflows/inspect-installer-evidence.yml'
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Comprehensive-Windows-Verification-c2d5b7c8222d83e732356c921b218f3de6291d57
          run-id: 39999819508
          github-token: ${{ github.token }}
          path: saved-evidence
      - name: Print actual Shell picker controls and failure windows
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('saved-evidence')
          for name in ('installer-failure-windows.json',):
              files = list(root.rglob(name))
              if not files:
                  raise SystemExit(f'Missing saved evidence: {name}')
              for path in files:
                  data = json.loads(path.read_text(encoding='utf-8-sig'))
                  print(f'EVIDENCE {path}: Inno={data.get("innoVersion")}')
                  print('TOP WINDOWS', json.dumps(data.get('topWindows'), ensure_ascii=False))
                  for entry in data.get('windows', []):
                      window = entry.get('window', {})
                      if window.get('title') != '文件夹已存在':
                          continue
                      print('EXISTING FOLDER DIALOG', json.dumps(window, ensure_ascii=False))
                      if 'error' in entry:
                          print('UIA ERROR', entry['error'])
                      for element in entry.get('elements', []):
                          print('UIA', json.dumps(element, ensure_ascii=False))
                      for child in entry.get('nativeChildren', []):
                          print('NATIVE CHILD', json.dumps(child, ensure_ascii=False))
          for path in root.rglob('windows-chinese-installer-log.txt'):
              raw = path.read_bytes()
              encoding = 'utf-16' if raw.startswith((b'\xff\xfe', b'\xfe\xff')) else 'utf-8-sig'
              print('INSTALLER LOG', path)
              print(raw.decode(encoding, errors='replace'))
          PY
