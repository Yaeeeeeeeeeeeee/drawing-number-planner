name: Publish verified P0 Windows acceptance installer
# Publish the fixed source and explicitly tracked verification evidence.
on:
  push:
    branches: [codex/p0-windows-acceptance-delivery-20261120]
    paths: ['.github/workflows/publish-stable-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-p0-acceptance-1.6.2
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SOURCE_SHA: ca5d58a430983b9875fe7ac46152f65561e9bdad
  VERIFIED_RUN: '44687980891'
  SETUP_DIGEST: 'sha256:2b5b3ba5f0a8ffd625110106053ef406ba173ed16cfc22cb07b38a979562e704'
  REPORT_DIGEST: 'sha256:627be040b2a6668bc5d63645efef78d2cc8dbea6ed21d3deeeefdb89224256bb'
  RELEASE_TAG: v1.6.2-p0-acceptance
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the exact successful installed build and pinned artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" > /tmp/verified-run.json
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN/artifacts" > /tmp/verified-artifacts.json
          python3 - <<'PY'
          import json,os,subprocess
          run=json.load(open('/tmp/verified-run.json'))
          assert run['head_sha']==os.environ['SOURCE_SHA'] and run['conclusion']=='success'
          assert run['path']=='.github/workflows/comprehensive-windows-delivery.yml'
          artifacts=json.load(open('/tmp/verified-artifacts.json'))['artifacts']
          for kind,digest in [('Chinese-Setup',os.environ['SETUP_DIGEST']),('Verification',os.environ['REPORT_DIGEST'])]:
              selected=[a for a in artifacts if a['name']==f"Comprehensive-Windows-{kind}-{os.environ['SOURCE_SHA']}"]
              assert len(selected)==1 and not selected[0]['expired'] and selected[0]['digest']==digest
              assert selected[0]['workflow_run']['head_sha']==os.environ['SOURCE_SHA']
          package=json.loads(subprocess.check_output(['git','show',os.environ['SOURCE_SHA']+':package.json']))
          assert package['version']=='1.6.2'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Comprehensive-Windows-Chinese-Setup-${{ env.SOURCE_SHA }}
          run-id: ${{ env.VERIFIED_RUN }}
          github-token: ${{ github.token }}
          path: verified-installer
      - uses: actions/download-artifact@v4
        with:
          name: Comprehensive-Windows-Verification-${{ env.SOURCE_SHA }}
          run-id: ${{ env.VERIFIED_RUN }}
          github-token: ${{ github.token }}
          path: verified-report
      - name: Verify native results and prepare unchanged EXE and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN/logs" > release-assets/Windows-build-logs.zip
          python3 - <<'PY'
          import pathlib,hashlib,shutil,json,os,zipfile
          report=pathlib.Path('verified-report')
          native=json.loads((report/'windows-comprehensive-verification.json').read_text(encoding='utf-8-sig'))
          assert native['revision']==os.environ['SOURCE_SHA']
          assert native['oldV15Upgrade']['realMigrationBackupValidated']
          assert native['freshBusinessTablesEmpty'] and native['freshRestartPreservesDatabase']
          assert native['rendererErrors']==[]
          assert native['nativeQrPdfPicker']['firstPagePixelComparisonObserved']
          assert all(native['outboundDraftRestart'][key] for key in ['actualProcessRestart','restoredThroughUi','allSavedFieldsPreserved','noArchiveRegeneration'])
          picker=json.loads((report/'native-profile-ait-original-reference.json').read_text(encoding='utf-8-sig'))
          assert picker['stage']=='completed' and picker['nativeFilePicker'] and picker['filenameReadBack'].endswith('.ait')
          assert native['v4']['manualPdfFiles']==12
          assert native['v41v42']['actualInstalledHttpAndDom'] and native['v41v42']['uniqueUnbatchedFilesShown']
          assert native['v41v42']['competingUnbatchedFilesProtectedWithoutPicker']
          assert native['v41v42']['batchContextMenu']['emptyBatchDeletionAndScanRediscovery']
          assert native['v5']['actualInstalledHttpAndDom'] and native['v5']['bomIdentityAndSnapshotsPreserved']
          assert native['v5']['imageZoomGallery'] and native['v5']['templateSavedWithoutProductOrSignature']
          assert native['v5']['forceRelease']['oldPdfIsolatedAfterRescan'] and native['v5']['forceRelease']['originalBomRetained']
          assert native['hotfix111']['reportedSourceAndAnnotatedProductionPaths'] and native['hotfix111']['sourceNodeAndInitialBatch'] and native['hotfix111']['sourceBatchColumnsCorrect']
          assert native['hotfix111']['sameIndexIdsAfterRescan'] and native['hotfix111']['originalPdfHashesPreserved']==2
          assert all(row['tableWidth']<=row['available']+1 and row['scrollWidth']<=row['available']+1 and row['buttonsInside'] for row in native['hotfix111']['tableContainment'])
          assert native['installationChoice']['actualInstaller']
          choices=native['installationChoice']['sameVersionReinstallChoices']
          assert len(choices)==2 and all(row['promptedAfterReinstall'] and row['createdWithoutFileSelection'] and row['normalRestartReusesChoice'] and row['oldDataRetained'] for row in choices)
          mail=native['v51']
          assert mail['actualHttpAndDom'] and mail['realXlsx'] and mail['fixtureWorkbookOnly']
          assert (mail['sheets'],mail['supportedSheets'],mail['recognizedTemplates'],mail['importedTemplates'],mail['contactsCreated'])==(3,2,3,1,2)
          assert mail['exactSelectedZipFileCount']==1 and mail['changedNameplateOnly']
          assert mail['reasonSynchronizes'] and mail['directBodyEditPreserved'] and mail['signatureOnce'] and mail['actualClipboardCopy']
          assert mail['originalPdfHashesPreserved']==4 and mail['protectedRowsUnchanged'] and mail['zipAndSnapshotsUnchangedByDraft']
          v52=native['v52']
          assert v52['actualInstalledHttpAndDom'] and v52['fixtureOnly']
          assert all(v52['layout'][key] for key in ['centeredCells','rightmostReceivesShrunkWidth','stickyControlsAndHeaders','pdfSixIconActionsTwoGroups'])
          files=v52['scopedFiles']
          assert (files['indexed'],files['excluded'],files['allBatches'],files['originalPdfHashesPreserved'])==(5,3,4,9)
          assert all(files[key] for key in ['sourceOnly02','dateDescending','currentAndHistoricalLabels','conflictOneRowNoPicker','unindexedReadOnly','missingVsUnavailable'])
          bom=v52['bom']
          assert bom['queryDropdowns']==3 and bom['originalAssetHashesPreserved']==3
          assert all(bom[key] for key in ['exactFirstRecordJump','dateCorrectedInPlace','identityCreatedAtLineagePreserved','currentPointerAndOtherRecordsPreserved','frozenSnapshotsPreserved','unifiedEntry','previousAttachmentRoleReuse','replacementUploadIndependent'])
          matrix=v52['mail']
          assert (matrix['sheets'],matrix['recognizedTemplates'],matrix['initial'],matrix['update'],matrix['uniqueContacts'],matrix['roleLinks'],matrix['independentSignatures'],matrix['sourceCasesPersisted'],matrix['reimportSkipped'])==(4,25,20,5,14,135,1,25,25)
          assert all(matrix[key] for key in ['anonymousMatrix','existingContactPreserved','defaultSignaturePreserved','sourceCoordinatesPersisted','rawCasesReadOnly','manualConfigurationPreservesRawSource','signatureOnce','protectedBusinessRowsAndDraftsPreserved'])
          hotfix=native['hotfix131']
          assert all(hotfix[key] for key in ['actualHttpAndDom','actualInstalledHttpAndDom','anonymousWorkbook','singleTemplateSharedCc','errorVisibleBesideButton','successVisibleBesideButton','failedImportRolledBack','reviewedEditsPreserved','sharedCompanyPreserved','protectedRowsPreserved'])
          assert all(0<=hotfix[key]['top']<hotfix[key]['bottom']<=hotfix[key]['viewport'] for key in ['errorGeometry','successGeometry'])
          ait=native['aitPackaging']
          assert all(ait[key] for key in ['actualInstalledHttpAndDom','catalogSavedThroughUi','matchingBasisChoicesThroughUi','rangeRuleAndSwapSaved','menuOrder','independentTaskMenu','numberOnlyMappingUi','planningNoDimensions','exactDrawingFocus','flatTemporaryDirectory','completedDeletionPreservesFiles','unfinishedDeletionReleasesLock','reservationToTask','watcherDetectedWithoutClick','manualAssociation','reviewHash','newArchiveAndScopedIndex','formalEditCopyOnly','formalBackupHashPreserved','backupReadableThroughRegisteredId','taskCleanupOnly','taskHistoryRetained','originalAitHashPreserved','protectedBusinessRowsPreserved','realProcessRestartPreservesTask'])
          confirmed=native['confirmedRequirements']
          assert all(confirmed[key] for key in ['actualInstalledHttpAndDom','fourStepBatch','modelSpecificSelections','distinctCompleteCodes','persistedDraftRequiresFreshCheck','explicitConfirmation','exactLibraryNavigation','deletedDrawingTaskSafelyEnded','detachedPdfNotReclaimed','formalFileHashPreserved','endedNotArchived','taskLockReleased'])
          assert not confirmed['productionDatabaseOperated']
          reselection=native['databaseReselection']
          assert all(reselection[key] for key in ['actualNativePicker','rendererCancelPreservesProfile','nativeMenuSwitch','selectedOtherExistingDirectory','returnedOriginalDirectory','protectedBusinessRowsPreserved','backupsRequiredAndVerified'])
          geometry=json.loads((report/'UI15-layout-geometry.json').read_text(encoding='utf-8-sig'))
          assert {row['width'] for row in geometry}=={3840,2560,1920,1440,720}
          assert all(row['scrollWidth']<=row['width']+1 for row in geometry)
          assert ait['aitFixtureReferenceOnly'] and not ait['realIllustratorGeneration'] and not ait['editablePdfReopenVerified']
          desktop=json.loads((report/'windows-desktop-install.json').read_text(encoding='utf-8-sig'))
          assert desktop['desktopFilePreserved'] and desktop['personalDataPreserved']
          assert desktop['chineseChild']['verifiedFiles']>0 and desktop['desktopRoot']['verifiedFiles']>0
          wizard=json.loads((report/'windows-chinese-installer.json').read_text(encoding='utf-8-sig'))
          assert wizard['shellFolderPicker'] and wizard['advancedToReady'] and wizard['typedDesktopRootRedirected']
          installed=json.loads((report/'installed-version.json').read_text(encoding='utf-8-sig'))
          assert installed['installedVersion']=='1.6.2' and installed['revision']==os.environ['SOURCE_SHA']
          large=json.loads((report/'large-database-startup.json').read_text(encoding='utf-8-sig'))
          assert large['fixtureOnly'] and large['sizeMiB']==960 and large['databaseBytes']>=1_000_000_000
          assert large['sameDatabaseOnRestart'] and large['logicalRowsPreserved'] and large['foreignKeysValid']
          assert sum(row['event']=='ready' for row in large['records'])==2
          assert not any(row['event']=='timeout' for row in large['records'])
          source=pathlib.Path('verified-installer/图号规划器-Windows-x64-安装包.exe')
          assert source.is_file() and source.read_bytes()[:2]==b'MZ'
          target=pathlib.Path('release-assets/DrawingNumberPlanner-1.6.2-P0-Windows-x64-Setup.exe')
          shutil.copyfile(source,target)
          assert hashlib.sha256(source.read_bytes()).digest()==hashlib.sha256(target.read_bytes()).digest()
          shutil.copyfile('docs/install-and-upgrade.md','release-assets/INSTALL-UPGRADE.md')
          notes=pathlib.Path('docs/p0-acceptance-delivery/RELEASE-NOTES.md')
          shutil.copyfile(notes,'release-assets/RELEASE-NOTES.md')
          shutil.copyfile('docs/p0-acceptance-delivery/TEST-REPORT.md','release-assets/TEST-REPORT.md')
          with zipfile.ZipFile('release-assets/Windows-build-logs.zip') as log:
              assert log.namelist() and log.testzip() is None
          installer_checksum = hashlib.sha256(target.read_bytes()).hexdigest()
          print('WINDOWS_INSTALLER_SHA256='+installer_checksum)
          with zipfile.ZipFile('release-assets/Verification-Windows-1.6.2-Verified.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(report.rglob('*')):
                  if file.is_file(): archive.write(file,file.relative_to(report))
          files=sorted(pathlib.Path('release-assets').iterdir())
          pathlib.Path('release-assets/SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Publish a separate acceptance download
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          test "$existing" = "$SOURCE_SHA" || { echo 'Refuse to replace another source tag'; exit 1; }
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title '图号规划器 1.6.2 · 第一批 P0 验收版' --notes-file release-assets/RELEASE-NOTES.md --draft --prerelease --latest=false
          fi
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.md --draft=false --prerelease --latest=false
