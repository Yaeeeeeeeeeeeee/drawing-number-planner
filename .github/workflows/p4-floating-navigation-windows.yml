# Shared navigation, real counts and Chinese custom-path empty-data candidate.
# Includes shared batch display prefix correction and PDF table consistency.
# Whole-product release uses a single model confirmation and reviewed snapshot.
# Native menu visibility remains the only allowed Main difference from the original runtime.
name: P4 floating navigation Windows candidate
on:
  push:
    branches: [codex/p4-floating-navigation-20261019]
    paths:
      - .github/workflows/p4-floating-navigation-windows.yml
      - scripts/repack-p4-bom-windows.mjs
      - scripts/p4-delivery-source-guard.ts
      - scripts/verify-p4-floating-navigation-windows.cjs
      - scripts/p4-windows-installer.iss
      - scripts/acceptance-entry.cjs
      - scripts/prepare-acceptance-data.cjs
      - scripts/initialize-empty-acceptance.ts
      - scripts/verify-p4-chinese-installer.ps1
      - scripts/installer-languages/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PLANNER_ACCEPTANCE_REVISION: ${{ github.sha }}
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: app-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: P4-Windows-x64-8dc2112
          run-id: 38697339387
          github-token: ${{ github.token }}
          path: existing-p4
      - name: Build exact integrated source
        shell: pwsh
        working-directory: app-source
        run: |
          npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          node node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          node node_modules/vite/bin/vite.js build
          if ($LASTEXITCODE -ne 0) { throw 'Renderer build failed' }
          node node_modules/typescript/bin/tsc -p tsconfig.main.json
          if ($LASTEXITCODE -ne 0) { throw 'Main build failed' }
      - name: Verify original runtime, exclude sample and repack empty UI
        shell: pwsh
        run: node scripts/repack-p4-bom-windows.mjs app-source existing-p4 P4-Windows-Integrated
      - name: Build the Chinese Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler unavailable' }
          }
          & $compiler "/DPackageRoot=$((Resolve-Path P4-Windows-Integrated).Path)" "/DInstallerOutput=$((Resolve-Path installer).Path)" scripts/p4-windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify Chinese directory-selection wizard
        shell: pwsh
        run: |
          & ./scripts/verify-p4-chinese-installer.ps1 -SetupPath 'installer/DrawingNumberPlanner-P4-Windows-x64-Setup.exe' -OutputDirectory 'installer'
      - name: Refuse an old sample-bearing installation target
        shell: pwsh
        run: |
          # Refuse an old sample-bearing target rather than deleting its files.
          $oldTarget = Join-Path $env:RUNNER_TEMP 'P4-existing-sample-target'
          $sentinel = Join-Path $oldTarget 'resources/app/acceptance-seed/planner.db'
          New-Item -ItemType Directory -Force (Split-Path $sentinel) | Out-Null
          Set-Content -Path $sentinel -Value 'existing sample must remain untouched'
          $beforeSentinel = (Get-FileHash $sentinel -Algorithm SHA256).Hash
          $refused = Start-Process (Resolve-Path 'installer/DrawingNumberPlanner-P4-Windows-x64-Setup.exe').Path -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$oldTarget`"") -PassThru
          if (!$refused.WaitForExit(30000)) { throw 'Old-target refusal did not terminate in time' }
          if ($refused.ExitCode -eq 0 -or (Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $beforeSentinel) { throw 'Old sample target was not safely refused' }
      - name: Install to a custom Chinese path and verify every installed hash
        shell: pwsh
        run: |
          $installed = Join-Path $env:RUNNER_TEMP '图号规划器-自定义安装路径'
          $process = Start-Process (Resolve-Path 'installer/DrawingNumberPlanner-P4-Windows-x64-Setup.exe').Path -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"") -PassThru
          if (!$process.WaitForExit(120000)) { throw 'Custom-path install did not terminate in time' }
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $root = (Resolve-Path P4-Windows-Integrated).Path
          Get-ChildItem $root -File -Recurse -Force | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($root, $_.FullName)
            $target = Join-Path $installed $relative
            if (!(Test-Path $target) -or (Get-FileHash $_.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $target -Algorithm SHA256).Hash) { throw "Installed file differs: $relative" }
          }
          "P4_INSTALLED_DIRECTORY=$installed" >> $env:GITHUB_ENV
      - name: Native Windows empty-data navigation verification
        shell: pwsh
        run: |
          node scripts/verify-p4-floating-navigation-windows.cjs app-source "$env:P4_INSTALLED_DIRECTORY/图号规划器验收版.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native verification failed' }
          Copy-Item "$env:P4_INSTALLED_DIRECTORY/Windows-浮动目录-*.png" installer/
          Copy-Item "$env:P4_INSTALLED_DIRECTORY/windows-floating-navigation.json" installer/

      - uses: actions/upload-artifact@v4
        with:
          name: P4-Floating-Navigation-Windows-x64-${{ github.sha }}
          path: P4-Windows-Integrated/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: P4-Floating-Navigation-Setup-${{ github.sha }}
          path: installer/
          if-no-files-found: error
          retention-days: 14
