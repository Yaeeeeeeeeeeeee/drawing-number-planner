# Product exit choices, dictionary refresh and origin/category presentation candidate.
# Includes shared batch display prefix correction and PDF table consistency.
# Native menu visibility remains the only allowed Main difference from the original runtime.
name: P4 floating navigation Windows candidate
on:
  push:
    branches: [codex/p4-floating-navigation-20261019]
    paths:
      - .github/workflows/p4-floating-navigation-windows.yml
      - scripts/repack-p4-bom-windows.mjs
      - scripts/p4-delivery-source-guard.ts
      - scripts/verify-p4-floating-navigation-windows.cjs
      - scripts/p4-windows-installer.iss
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PLANNER_ACCEPTANCE_REVISION: ${{ github.sha }}
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: app-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: P4-Windows-x64-8dc2112
          run-id: 38697339387
          github-token: ${{ github.token }}
          path: existing-p4
      - name: Build exact integrated source
        shell: pwsh
        working-directory: app-source
        run: |
          npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          node node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          node node_modules/vite/bin/vite.js build
          if ($LASTEXITCODE -ne 0) { throw 'Renderer build failed' }
          node node_modules/typescript/bin/tsc -p tsconfig.main.json
          if ($LASTEXITCODE -ne 0) { throw 'Main build failed' }
      - name: Preserve original sample and runtime, repack integrated UI
        shell: pwsh
        run: node scripts/repack-p4-bom-windows.mjs app-source existing-p4 P4-Windows-Integrated
      - name: Build and install the complete Windows candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler unavailable' }
          }
          & $compiler "/DPackageRoot=$((Resolve-Path P4-Windows-Integrated).Path)" "/DInstallerOutput=$((Resolve-Path installer).Path)" scripts/p4-windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $installed = Join-Path $env:RUNNER_TEMP 'P4-floating-installed'
          $process = Start-Process (Resolve-Path 'installer/DrawingNumberPlanner-P4-Windows-x64-Setup.exe').Path -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $root = (Resolve-Path P4-Windows-Integrated).Path
          Get-ChildItem $root -File -Recurse -Force | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($root, $_.FullName)
            $target = Join-Path $installed $relative
            if (!(Test-Path $target) -or (Get-FileHash $_.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $target -Algorithm SHA256).Hash) { throw "Installed file differs: $relative" }
          }
          "P4_INSTALLED_DIRECTORY=$installed" >> $env:GITHUB_ENV
      - name: Native Windows floating navigation verification
        shell: pwsh
        run: |
          node scripts/verify-p4-floating-navigation-windows.cjs app-source "$env:P4_INSTALLED_DIRECTORY/图号规划器验收版.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native verification failed' }
          Copy-Item "$env:P4_INSTALLED_DIRECTORY/Windows-浮动目录-*.png" installer/
          Copy-Item "$env:P4_INSTALLED_DIRECTORY/windows-floating-navigation.json" installer/

      - uses: actions/upload-artifact@v4
        with:
          name: P4-Floating-Navigation-Windows-x64-${{ github.sha }}
          path: P4-Windows-Integrated/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: P4-Floating-Navigation-Setup-${{ github.sha }}
          path: installer/
          if-no-files-found: error
          retention-days: 14
